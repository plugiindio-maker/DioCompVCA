name: Build DioCompVCA

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\DioCompVCA.iss'
      - name: Zip VST3 (sin instalador)
        shell: pwsh
        run: Compress-Archive -Path "build/DioCompVCA_artefacts/Release/VST3/DioCompVCA.vst3" -DestinationPath DioCompVCA_VST3_Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DioCompVCA-Windows-Instalador
          path: installer/Output/DioCompVCA_Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DioCompVCA-Windows-VST3-zip
          path: DioCompVCA_VST3_Windows.zip
