name: Build DioCompress
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\DioCompress.iss'
      - name: Zip VST3 (sin instalador)
        shell: pwsh
        run: Compress-Archive -Path "build/DioCompress_artefacts/Release/VST3/DioCompress.vst3" -DestinationPath DioCompress_VST3_Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DioCompress-Windows-Instalador
          path: installer/Output/DioCompress_Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DioCompress-Windows-VST3-zip
          path: DioCompress_VST3_Windows.zip
